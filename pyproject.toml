[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "configloader"
version = "0.1.7"
description = "Config Parser and Loader"
readme = "README.md"
license = {text = "BSD 2-clause"}
authors = [
  {name = "Shahab Ghosni", email = "s.ghosni@liateam.ir"}
]
dependencies = [
  "annotated-types >=0.5.0",
  "configparser >=6.0.0",
  "pydantic >=1.10.0",
  "pydantic_core >=2.4.0",
  "typing_extensions >=4.7.1"
]

[project.urls]
Homepage = "https://git.liateam.net/python/packages/configloader.git"

[tool.setuptools]
packages = ["configloader"]
include-package-data = true
